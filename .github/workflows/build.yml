name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"
  ANDROID_NDK_VERSION: "27.2.12479018" # r27c
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK (hybrid)
        run: |
          set -euo pipefail
          
          # First, check if Android SDK is pre-installed (common on ubuntu-latest)
          PREINSTALLED_SDK_PATHS=(
            "/usr/local/lib/android/sdk"
            "$HOME/Android/Sdk"
            "/opt/android/sdk"
          )
          
          ANDROID_HOME=""
          for path in "${PREINSTALLED_SDK_PATHS[@]}"; do
            if [ -d "$path/cmdline-tools/latest/bin" ] && [ -f "$path/cmdline-tools/latest/bin/sdkmanager" ]; then
              ANDROID_HOME="$path"
              echo "Found pre-installed Android SDK at $ANDROID_HOME"
              break
            elif [ -d "$path" ] && [ -f "$path/tools/bin/sdkmanager" ]; then
              # Old structure
              ANDROID_HOME="$path"
              echo "Found pre-installed Android SDK (old structure) at $ANDROID_HOME"
              break
            fi
          done
          
          # If not found, install from scratch
          if [ -z "$ANDROID_HOME" ]; then
            echo "No pre-installed SDK found, installing from scratch..."
            ANDROID_SDK_ROOT="/usr/local/lib/android/sdk"
            mkdir -p "$ANDROID_SDK_ROOT"
            
            # Download command line tools - use a known stable version
            CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            cd "$ANDROID_SDK_ROOT"
            echo "Downloading cmdline-tools..."
            wget -q "$CMDLINE_TOOLS_URL" -O cmdline-tools.zip || { echo "Download failed"; exit 1; }
            echo "Extracting..."
            unzip -q cmdline-tools.zip -d cmdline-tools-temp || { echo "Unzip failed"; exit 1; }
            echo "Extracted contents:"
            ls -la cmdline-tools-temp/
            
            # Handle both possible extracted structures
            mkdir -p cmdline-tools/latest
            if [ -d "cmdline-tools-temp/cmdline-tools" ]; then
              mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/
            else
              mv cmdline-tools-temp/* cmdline-tools/latest/
            fi
            rm -rf cmdline-tools-temp cmdline-tools.zip
            
            ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          
          export ANDROID_HOME
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          
          # Verify sdkmanager exists
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -name "sdkmanager" -type f 2>/dev/null
            exit 1
          fi
          
          # Accept licenses and install packages
          echo "Accepting licenses..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          echo "Installing packages..."
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"
          
          # Set NDK and CMake paths
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          
          # Verify
          echo "=== Android SDK ==="
          ls -la "$ANDROID_HOME/platforms/"
          echo "=== NDK ==="
          ls -la "$ANDROID_NDK_HOME/"
          echo "=== CMake ==="
          "$ANDROID_NDK_HOME/build/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake" --version

      - name: Install Vulkan SDK
        # The ggml Vulkan backend of llama.cpp needs the Vulkan C++ header
        # (vulkan.hpp is not part of the NDK sysroot) and glslc, which compiles
        # the capability probe shaders while CMake configures the project.
        run: |
          set -euo pipefail
          wget -qO /tmp/lunarg.asc https://packages.lunarg.com/lunarg-signing-key-pub.asc
          gpg --dearmor < /tmp/lunarg.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg-vulkan.gpg > /dev/null
          . /etc/os-release
          wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-${VERSION_CODENAME}.list"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends vulkan-sdk \
            || sudo apt-get install -y --no-install-recommends vulkan-headers vulkan-tools shaderc

          # Re-home the headers and the shader compiler into a self-contained
          # prefix: adding /usr/include to the cross compilation include path
          # would expose the host glibc headers to the Android toolchain.
          mkdir -p "$RUNNER_TEMP/vulkan/include" "$RUNNER_TEMP/vulkan/bin"
          cp -r /usr/include/vulkan "$RUNNER_TEMP/vulkan/include/"
          ln -sf "$(command -v glslc)" "$RUNNER_TEMP/vulkan/bin/glslc"
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vulkan/bin/glslc" --version

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            cxx-${{ runner.os }}-

      - name: Generate Gradle wrapper
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

      - name: Build
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  wrapper:
    name: Publish Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate wrapper
        run: gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

      - name: Commit wrapper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle wrapper already up to date."
            exit 0
          fi
          git commit -m "chore(ci): publish Gradle ${GRADLE_VERSION} wrapper"
          git push origin "HEAD:${GITHUB_REF_NAME}"
