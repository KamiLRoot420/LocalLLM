name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"
  ANDROID_NDK_VERSION: "27.2.12479018" # r27c
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: Verify gradle
        run: gradle --version

      - name: Debug - Check pre-installed Android SDK
        run: |
          echo "=== Checking pre-installed Android SDK ==="
          find / -name "sdkmanager" -type f 2>/dev/null | head -20
          find / -name "cmdline-tools" -type d 2>/dev/null | head -20
          ls -la /usr/local/lib/android/ 2>/dev/null || echo "No /usr/local/lib/android"
          ls -la /opt/android/ 2>/dev/null || echo "No /opt/android"
          ls -la ~/android/ 2>/dev/null || echo "No ~/android"
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not set}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 platform-tools build-tools;35.0.0"
          cmdline-tools-version: "15859902"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install NDK and CMake
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Set up NDK path and verify CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms/" || true
          
          # NDK installed by sdkmanager goes to $ANDROID_HOME/ndk/<version>
          NDK_PATH="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          if [ -d "$NDK_PATH" ]; then
            export ANDROID_NDK_HOME="$NDK_PATH"
            echo "Set ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            ls -la "$ANDROID_NDK_HOME/"
          else
            echo "ERROR: NDK not found at $NDK_PATH"
            find "$ANDROID_HOME/ndk" -maxdepth 1 -type d 2>/dev/null || true
            exit 1
          fi
          
          # CMake installed by sdkmanager goes to $ANDROID_HOME/cmake/<version> (SEPARATE from NDK!)
          CMAKE_PATH="$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}"
          if [ -d "$CMAKE_PATH" ]; then
            CMAKE_BIN="$CMAKE_PATH/bin/cmake"
            echo "Found cmake at: $CMAKE_BIN"
            "$CMAKE_BIN" --version
          else
            echo "ERROR: CMake not found at $CMAKE_PATH"
            find "$ANDROID_HOME/cmake" -maxdepth 1 -type d 2>/dev/null || true
            exit 1
          fi

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_NDK_HOME" >> local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}" >> local.properties
          cat local.properties

      - name: Install glslc (Vulkan shader compiler) if available
        run: |
          set -euo pipefail
          sudo apt-get update -y
          # Try to install glslc from default repos
          if sudo apt-get install -y --no-install-recommends glslc 2>/dev/null; then
            echo "glslc installed successfully"
          else
            echo "glslc not available in default repos, trying shaderc..."
            sudo apt-get install -y --no-install-recommends shaderc 2>/dev/null || echo "shaderc also not available"
          fi
          
          # Check if glslc is available
          if command -v glslc &> /dev/null; then
            mkdir -p "$RUNNER_TEMP/vulkan/bin"
            ln -sf "$(command -v glslc)" "$RUNNER_TEMP/vulkan/bin/glslc"
            echo "VULKAN_SDK=$RUNNER_TEMP/vulkan" >> "$GITHUB_ENV"
            "$RUNNER_TEMP/vulkan/bin/glslc" --version
          else
            echo "WARNING: glslc not found, Vulkan shader compilation may fail"
            # Create dummy to avoid errors
            mkdir -p "$RUNNER_TEMP/vulkan/bin"
            echo "VULKAN_SDK=$RUNNER_TEMP/vulkan" >> "$GITHUB_ENV"
          fi

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            cxx-${{ runner.os }}-

      - name: Build (capture logs)
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon --info > build.log 2>&1 || true
          echo "BUILD_EXIT_CODE=$?" >> $GITHUB_ENV
          tail -200 build.log
        continue-on-error: true

      - name: List build outputs
        run: |
          echo "=== Build outputs ==="
          find app/build -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20
          ls -la app/build/outputs/ 2>/dev/null || echo "No outputs dir"
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk dir"
          ls -la app/build/outputs/bundle/ 2>/dev/null || echo "No bundle dir"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Build Outputs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          find app/build -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20 >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### app/build/outputs/" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          ls -la app/build/outputs/ 2>/dev/null >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Check build result
        if: env.BUILD_EXIT_CODE != '0'
        run: |
          echo "Build failed with exit code $BUILD_EXIT_CODE"
          exit $BUILD_EXIT_CODE

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/*/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/bundle/debug/*.aab
          if-no-files-found: error

  wrapper:
    name: Publish Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: Generate wrapper
        run: gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

      - name: Commit wrapper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle wrapper already up to date."
            exit 0
          fi
          git commit -m "chore(ci): publish Gradle ${GRADLE_VERSION} wrapper"
          git push origin "HEAD:${GITHUB_REF_NAME}"