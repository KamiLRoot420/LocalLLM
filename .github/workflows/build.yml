name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"
  ANDROID_NDK_VERSION: "27.2.12479018" # r27c
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install git (for FetchContent)
        run: sudo apt-get update -y && sudo apt-get install -y git

      - name: Install Gradle
        run: |
          set -euo pipefail
          GRADLE_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "Downloading Gradle ${GRADLE_VERSION}..."
          curl -L -o /tmp/gradle.zip "$GRADLE_URL"
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-${GRADLE_VERSION}/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Debug - Check pre-installed Android SDK
        run: |
          echo "=== Checking pre-installed Android SDK ==="
          find / -name "sdkmanager" -type f 2>/dev/null | head -20
          find / -name "cmdline-tools" -type d 2>/dev/null | head -20
          ls -la /usr/local/lib/android/ 2>/dev/null || echo "No /usr/local/lib/android"
          ls -la /opt/android/ 2>/dev/null || echo "No /opt/android"
          ls -la ~/android/ 2>/dev/null || echo "No ~/android"
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not set}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 platform-tools build-tools;35.0.0"
          cmdline-tools-version: "15859902"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install NDK and CMake
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Set up NDK path and verify CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms/" || true
          
          # NDK installed by sdkmanager goes to $ANDROID_HOME/ndk/<version>
          NDK_PATH="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          if [ -d "$NDK_PATH" ]; then
            export ANDROID_NDK_HOME="$NDK_PATH"
            echo "Set ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            ls -la "$ANDROID_NDK_HOME/"
          else
            echo "ERROR: NDK not found at $NDK_PATH"
            find "$ANDROID_HOME/ndk" -maxdepth 1 -type d 2>/dev/null || true
            exit 1
          fi
          
          # CMake installed by sdkmanager goes to $ANDROID_HOME/cmake/<version> (SEPARATE from NDK!)
          CMAKE_PATH="$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}"
          if [ -d "$CMAKE_PATH" ]; then
            CMAKE_BIN="$CMAKE_PATH/bin/cmake"
            echo "Found cmake at: $CMAKE_BIN"
            "$CMAKE_BIN" --version
          else
            echo "ERROR: CMake not found at $CMAKE_PATH"
            find "$ANDROID_HOME/cmake" -maxdepth 1 -type d 2>/dev/null || true
            exit 1
          fi

      - name: Install Vulkan development packages
        run: |
          set -euo pipefail
          sudo apt-get update -y
          # Install Vulkan headers, loader, and glslc from Ubuntu repos
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev \
            vulkan-tools \
            glslc 2>/dev/null || echo "Some packages not available, continuing..."
          
          # Set VULKAN_SDK for CMake find_package
          if [ -d "/usr/lib/x86_64-linux-gnu" ] && [ -f "/usr/include/vulkan/vulkan.h" ]; then
            echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"
            echo "Using system Vulkan SDK at /usr"
          else
            mkdir -p "$RUNNER_TEMP/vulkan"
            echo "VULKAN_SDK=$RUNNER_TEMP/vulkan" >> "$GITHUB_ENV"
            echo "Using dummy Vulkan SDK"
          fi
          
          # Check glslc
          if command -v glslc &> /dev/null; then
            echo "glslc found: $(command -v glslc)"
            glslc --version
          else
            echo "WARNING: glslc not found"
          fi

      - name: Debug - Verify paths before CMake
        run: |
          set -euo pipefail
          echo "=== Verifying paths before CMake ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "VULKAN_SDK=$VULKAN_SDK"
          echo "ANDROID_CMAKE_VERSION=$ANDROID_CMAKE_VERSION"
          
          # Check toolchain file
          TOOLCHAIN="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          if [ -f "$TOOLCHAIN" ]; then
            echo "Toolchain file found: $TOOLCHAIN"
          else
            echo "ERROR: Toolchain file NOT found at $TOOLCHAIN"
            find "$ANDROID_NDK_HOME" -name "android.toolchain.cmake" 2>/dev/null
            exit 1
          fi
          
          # Check CMake binary
          CMAKE_BIN="$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"
          if [ -f "$CMAKE_BIN" ]; then
            echo "CMake binary found: $CMAKE_BIN"
            "$CMAKE_BIN" --version
          else
            echo "ERROR: CMake binary NOT found at $CMAKE_BIN"
            exit 1
          fi
          
          # Check Vulkan SDK
          if [ -d "$VULKAN_SDK" ]; then
            echo "VULKAN_SDK directory exists: $VULKAN_SDK"
            ls -la "$VULKAN_SDK"
          else
            echo "WARNING: VULKAN_SDK directory does not exist: $VULKAN_SDK"
          fi

      - name: Debug - Test CMake configuration
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
        run: |
          set -euo pipefail
          echo "=== Testing CMake configuration ==="
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "VULKAN_SDK=$VULKAN_SDK"
          CMAKE_BIN="$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}/bin/cmake"
          cd app/src/main/cpp
          "$CMAKE_BIN" -B build_test \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DGGML_VULKAN=ON \
            -DGGML_NATIVE=OFF \
            -DCMAKE_BUILD_TYPE=Debug
          echo "=== CMake configure succeeded ==="
          ls -la build_test/

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            cxx-${{ runner.os }}-

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          VULKAN_SDK: ${{ env.VULKAN_SDK }}
        run: gradle :app:assembleDebug --info --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  wrapper:
    name: Publish Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install git (for FetchContent)
        run: sudo apt-get update -y && sudo apt-get install -y git

      - name: Install Gradle
        run: |
          set -euo pipefail
          GRADLE_URL="https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          echo "Downloading Gradle ${GRADLE_VERSION}..."
          curl -L -o /tmp/gradle.zip "$GRADLE_URL"
          unzip -q /tmp/gradle.zip -d /opt
          ln -sf /opt/gradle-${GRADLE_VERSION}/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Generate wrapper
        run: gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

      - name: Commit wrapper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle wrapper already up to date."
            exit 0
          fi
          git commit -m "chore(ci): publish Gradle ${GRADLE_VERSION} wrapper"
          git push origin "HEAD:${GITHUB_REF_NAME}"