name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"
  ANDROID_NDK_VERSION: "27.2.12479018" # r27c
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Debug - Check pre-installed Android SDK
        run: |
          echo "=== Checking pre-installed Android SDK ==="
          find / -name "sdkmanager" -type f 2>/dev/null | head -20
          find / -name "cmdline-tools" -type d 2>/dev/null | head -20
          ls -la /usr/local/lib/android/ 2>/dev/null || echo "No /usr/local/lib/android"
          ls -la /opt/android/ 2>/dev/null || echo "No /opt/android"
          ls -la ~/android/ 2>/dev/null || echo "No ~/android"
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not set}"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 platform-tools build-tools;35.0.0"
          cmdline-tools-version: "15859902"

      - name: Install NDK and CMake
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

      - name: Debug - Verify NDK structure
        run: |
          echo "=== NDK Debug ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-not set}"
          ls -la "$ANDROID_HOME/" || true
          find "$ANDROID_HOME" -name "cmake" -type f 2>/dev/null | head -20
          find "$ANDROID_HOME" -name "ndk" -type d 2>/dev/null | head -20
          # Try to find NDK path
          NDK_PATH=$(find "$ANDROID_HOME" -maxdepth 3 -path "*/ndk/*" -name "source.properties" 2>/dev/null | head -1 | xargs dirname 2>/dev/null || true)
          if [ -n "$NDK_PATH" ]; then
            echo "Found NDK at: $NDK_PATH"
            ls -la "$NDK_PATH/"
          fi

      - name: Verify Android SDK and find CMake
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-not set}"
          ls -la "$ANDROID_HOME/platforms/" || true
          
          # Find NDK if ANDROID_NDK_HOME not set
          if [ -z "${ANDROID_NDK_HOME:-}" ] || [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "ANDROID_NDK_HOME not set or invalid, searching..."
            NDK_PATH=$(find "$ANDROID_HOME" -maxdepth 3 -path "*/ndk/*" -name "source.properties" 2>/dev/null | head -1 | xargs dirname 2>/dev/null || true)
            if [ -n "$NDK_PATH" ] && [ -d "$NDK_PATH" ]; then
              export ANDROID_NDK_HOME="$NDK_PATH"
              echo "Set ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
            fi
          fi
          
          if [ -n "${ANDROID_NDK_HOME:-}" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            ls -la "$ANDROID_NDK_HOME/"
            # Find cmake dynamically
            CMAKE_BIN=$(find "$ANDROID_NDK_HOME" -name "cmake" -type f 2>/dev/null | head -1)
            if [ -n "$CMAKE_BIN" ]; then
              echo "Found cmake at: $CMAKE_BIN"
              "$CMAKE_BIN" --version
            else
              echo "ERROR: cmake not found in NDK"
              exit 1
            fi
          else
            echo "ERROR: Could not locate NDK"
            exit 1
          fi

      - name: Install Vulkan SDK
        run: |
          set -euo pipefail
          wget -qO /tmp/lunarg.asc https://packages.lunarg.com/lunarg-signing-key-pub.asc
          gpg --dearmor < /tmp/lunarg.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg-vulkan.gpg > /dev/null
          . /etc/os-release
          wget -qO /etc/apt/sources.list.d/lunarg-vulkan.list \
            "https://packages.lunarg.com/vulkan/lunarg-vulkan-${VERSION_CODENAME}.list"
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends vulkan-sdk \
            || sudo apt-get install -y --no-install-recommends vulkan-headers vulkan-tools shaderc

          mkdir -p "$RUNNER_TEMP/vulkan/include" "$RUNNER_TEMP/vulkan/bin"
          cp -r /usr/include/vulkan "$RUNNER_TEMP/vulkan/include/"
          ln -sf "$(command -v glslc)" "$RUNNER_TEMP/vulkan/bin/glslc"
          echo "VULKAN_SDK=$RUNNER_TEMP/vulkan" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/vulkan/bin/glslc" --version

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            cxx-${{ runner.os }}-

      - name: Generate Gradle wrapper
        run: |
          chmod +x gradlew
          gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

      - name: Build
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  wrapper:
    name: Publish Gradle wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate wrapper
        run: gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

      - name: Commit wrapper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle wrapper already up to date."
            exit 0
          fi
          git commit -m "chore(ci): publish Gradle ${GRADLE_VERSION} wrapper"
          git push origin "HEAD:${GITHUB_REF_NAME}"